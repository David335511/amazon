# ──────────────────────────────────────────────────────────────
# Amazon AI Commerce Platform — Testing Configuration
# ──────────────────────────────────────────────────────────────
app:
  name: Amazon-Test
  debug: true
  log_level: DEBUG
  cors:
    allowed_origins:
      - "*"
    allow_credentials: true
    allow_methods: ["*"]
    allow_headers: ["*"]

database:
  pool_size: 2
  max_overflow: 5
  echo: false
  pool_pre_ping: true
  pool_recycle: 60

redis:
  socket_connect_timeout: 2
  # Must exceed the agent worker's BLPOP block timeout (5s); otherwise an
  # empty-queue BLPOP hits the client read timeout and logs "Timeout reading".
  socket_timeout: 20
  retry_on_timeout: false
  socket_keepalive: true
  health_check_interval: 10

server:
  host: "127.0.0.1"
  port: 8000
  reload: false
  workers: 1
  max_request_size: 1048576

logging:
  format: json
  level: DEBUG
  handlers:
    - console
  file_path: null
  rotation: null
  retention: null

telemetry:
  enabled: false
  service_name: amazon-test
  exporter_otlp_endpoint: null
  traces_sampler: parentbased_always_off
  metrics_exporter: none
  logs_exporter: none
  instrument_fastapi: false
  instrument_sqlalchemy: false
  instrument_redis: false

features:
  enable_swagger: true
  enable_metrics: false
  rate_limiting: false

i18n:
  enabled: true
  default_language: en
  fallback_language: en
  supported_languages: [en, zh-CN]
  persist_to_db: true
  persist_to_user_profile: true

multilingual:
  enabled: true
  default_language: en
  supported_languages: [en, zh-CN]
  detect_min_cjk_ratio: 0.5
  detect_min_latin_ratio: 0.5
  prompt_inject_language: true
  llm_translate: true
  llm_translate_fallback: true

plugins:
  default_timeout: 30
  default_retries: 3
  suppliers:
    # Supplier plugins are auto-discovered from app/plugins/suppliers. Flip
    # `enabled: true` to let the agent scheduler scan that supplier each cycle.
    # Real suppliers need API credentials (base_url + api_key) to return
    # products. NEVER commit live keys here — keep placeholders and inject
    # credentials securely (env var / Render secret).
    # `demo` is an offline seed supplier (see app/plugins/suppliers/demo.py)
    # used to demonstrate the agent end-to-end without external APIs. Seed
    # matching products via POST /api/v1/agent/seed, then run a cycle.
    demo:
      code: demo
      name: Demo
      enabled: true
    walmart:
      code: walmart
      name: Walmart
      enabled: false
      api_key: ""
      base_url: https://marketplace.walmartapis.com/v3
    bestbuy:
      code: bestbuy
      name: Best Buy
      enabled: false
      api_key: ""
    target:
      code: target
      name: Target
      enabled: false
      api_key: ""
    costco:
      code: costco
      name: Costco
      enabled: false
      api_key: ""
    homedepot:
      code: homedepot
      name: Home Depot
      enabled: false
      api_key: ""
