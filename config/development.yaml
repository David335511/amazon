# ──────────────────────────────────────────────────────────────
# Amazon AI Commerce Platform — Development Configuration
# ──────────────────────────────────────────────────────────────
app:
  name: Amazon
  debug: true
  log_level: DEBUG
  cors:
    allowed_origins:
      - "http://localhost:3000"
      - "http://localhost:8000"
    allow_credentials: true
    allow_methods: ["*"]
    allow_headers: ["*"]

database:
  pool_size: 10
  max_overflow: 20
  echo: false
  pool_pre_ping: true
  pool_recycle: 3600

redis:
  socket_connect_timeout: 5
  socket_timeout: 5
  retry_on_timeout: true
  health_check_interval: 30

server:
  host: "0.0.0.0"
  port: 8000
  reload: true
  workers: 1
  max_request_size: 10485760  # 10 MB

logging:
  format: json
  level: DEBUG
  handlers:
    - console
    - file
  file_path: logs/amazon.log
  rotation: "D"
  retention: "30 days"

telemetry:
  enabled: true
  service_name: amazon
  exporter_otlp_endpoint: http://localhost:4317
  traces_sampler: parentbased_always_on
  metrics_exporter: none
  logs_exporter: none
  instrument_fastapi: true
  instrument_sqlalchemy: true
  instrument_redis: true

features:
  enable_swagger: true
  enable_metrics: true
  rate_limiting: false

browser:
  # Master switch. When false (default), no browser is ever launched.
  enabled: false
  browser:
    headless: true
    visible: false
    viewport_width: 1280
    viewport_height: 720
    navigation_timeout_ms: 30000
    wait_until: domcontentloaded
    max_retries: 3
    request_delay_min_ms: 500
    request_delay_max_ms: 2000
    block_resource_types:
      - image
      - media
      - font
    max_pages: 8
    page_idle_timeout_seconds: 120
    captcha_detection_enabled: true
    storage_dir: browser_data
    screenshot_dir: browser_data/screenshots
    archive_dir: browser_data/archives
    session_dir: browser_data/sessions
    cookie_file: browser_data/cookies.json
    fingerprint:
      enabled: false
      randomize_user_agent: true
      randomize_viewport: false
      randomize_locale: true
      randomize_timezone: true
      randomize_device_scale_factor: true
    proxy:
      rotation: round_robin
      max_failures_before_ban: 5
      proxies: []

event_bus:
  enabled: true
  default_max_retries: 3
  backoff_base_ms: 200
  backoff_max_ms: 5000
  jitter: true
  dlq_capacity: 1000
  # Distributed transport. "memory" (default) is the in-process broker;
  # "redis" selects the Redis Streams broker for horizontal scaling.
  broker_type: memory

memory:
  enabled: true
  # Embeddings: "local" (deterministic hashing, always available) or "ollama"
  # for real semantic embeddings (requires a running Ollama with an embedding
  # model pulled, e.g. `ollama pull nomic-embed-text`).
  embedding_provider: local
  embedding_enabled: true
  embedding_dim: 128
  ollama_url: http://localhost:11434
  ollama_model: nomic-embed-text
  short_term_ttl_seconds: 86400
  consolidation_importance_threshold: 0.7
  decay_factor: 0.05
  min_importance: 0.1
  recall_top_k: 10
  recall_threshold: 0.25
  recall_recent_limit: 20
  max_results_per_type: 100

security:
  # Phase 0 API auth. Leave `enabled: false` for local development; set to true
  # and provide keys to protect the /api/v1 tree. Keys can come from env
  # `API_KEYS` (comma-separated) which overrides this block.
  enabled: false
  api_keys: []
  header_name: X-API-Key
  public_paths:
    - /api/v1/health

vision:
  # Computer-vision subsystem. Pure-stdlib `local` provider is the default and
  # always available (embeddings, color/shape/size/package, model-number scan,
  # heuristic barcode/logo). `tesseract` adds real OCR; `http` delegates to any
  # generic remote vision service (base_url/api_key below).
  enabled: true
  provider: local
  max_decode_bytes: 10000000
  embed_grid: 16
  shape_grid: 8
  color_buckets: 4
  dominant_color_count: 5
  barcode_transition_threshold: 28
  match_threshold: 0.55
  weight_upc: 0.30
  weight_brand: 0.15
  weight_title: 0.15
  weight_attributes: 0.10
  weight_embedding: 0.10
  weight_color: 0.05
  weight_shape: 0.05
  weight_size: 0.03
  weight_barcode: 0.03
  weight_logo: 0.02
  weight_model: 0.02
  hard_mismatch_penalty: 0.35
  http_base_url: ""
  http_api_key: ""

documents:
  # Document intelligence system. Pure-stdlib parsers (PDF text-stream, HTML,
  # DOCX, XLSX, CSV, plain text) are the default and always available.
  # OCR is a fallback for scanned/image-only documents: "local" (no-op),
  # "tesseract" (requires `pip install '.[documents]'` + pytesseract/Pillow),
  # or "http" (generic remote OCR service via http_base_url/http_api_key).
  enabled: true
  max_document_bytes: 10485760   # 10 MB
  ocr_enabled: false
  ocr_provider: local
  ocr_min_text_length: 20
  enable_pdf: true
  enable_html: true
  enable_docx: true
  enable_csv: true
  enable_xlsx: true
  enable_text: true
  http_base_url: ""
  http_api_key: ""

feature_store:
  # Feature engineering platform. Computed metrics are stored once and reused
  # until stale (computed_at + ttl), then recomputed. Each value records its
  # method, timestamp, confidence, version and lineage.
  enabled: true
  # Default freshness TTL when a feature does not declare its own.
  default_ttl_seconds: 3600
  # Signal acquisition: "local" (default). Future DB/HTTP/feature-server
  # providers plug in here.
  signal_provider: local
  max_batch_size: 100

forecasting:
  # Forecasting platform. Predicts future price / ROI / profit / inventory /
  # sales / Buy Box ownership / competition from historical series. Each
  # forecast returns a point prediction, a 95% confidence interval, an
  # explanation and historical accuracy (MAE/MAPE/RMSE/bias from recorded
  # actuals). Models are pluggable behind one interface; the ensemble combines
  # all available members by inverse-variance weighting.
  enabled: true
  # Model used when a request does not name one: "ensemble" (default) or any
  # registered model name (e.g. "moving_average", "linear_trend",
  # "llm_reasoning").
  default_model: ensemble
  max_horizon: 36        # max look-ahead periods per request
  max_batch_size: 50     # max items per batch-forecast call
  # ML models (sklearn) are only registered when enable_ml is true AND
  # scikit-learn is installed (`pip install '.[forecasting]'`).
  enable_ml: true
  # LLM reasoning always runs (deterministic narrative) unless toggled off;
  # a real provider plugs in via llm_provider.
  enable_llm: true
  llm_provider: reasoning
  # Members used by the ensemble (subset of registered model names).
  ensemble_members:
    - moving_average
    - exponential_smoothing
    - linear_trend
    - seasonal_average
    - persistence
    - llm_reasoning

finance:
  # Financial optimization engine. Tracks available cash, inventory value,
  # expected payouts, credit-card cycles, cashback, reward points, purchase
  # commitments, storage costs and capital allocation; recommends how many
  # units to buy, when to buy/reorder, and which opportunity is most
  # capital-efficient. Everything here is configurable.
  enabled: true
  currency: USD
  starting_cash: 10000.0

  # Credit cards
  credit_card_limit: 5000.0
  billing_cycle_days: 30
  grace_period_days: 21

  # Rewards
  cashback_rate: 0.02
  reward_points_value: 0.01
  points_per_dollar: 1.0

  # Costs
  holding_cost_rate: 0.25       # annual % of inventory value
  order_cost: 5.0               # fixed cost per purchase order

  # Inventory / demand
  service_level_z: 1.65         # 95% service level for safety stock
  max_units_per_order: 1000

  # Capital allocation
  allocation_policy: efficiency # efficiency | equal | conservative
  investable_fraction: 0.8      # fraction of usable capital to deploy
  min_cash_reserve: 500.0       # cash held back before allocating

  max_batch_size: 50

supplier_intel:
  # Supplier intelligence. Tracks the HISTORICAL behaviour of suppliers
  # (prices, sale frequency, coupon frequency, inventory stability, shipping
  # speed, return policy, customer service, order-cancellation rate, discount
  # patterns, stockout frequency) and computes five scores purely from that
  # history: reliability, volatility, discount, risk, seasonality. Each
  # profile also returns an AI explanation of supplier behaviour. All
  # scoring thresholds are configurable.
  enabled: true

  # Scoring thresholds.
  max_shipping_days: 14.0      # shipping at/above this scores zero on shipping reliability
  volatility_scale: 0.5        # coefficient-of-variation considered "high"
  max_coupon_rate: 5.0         # coupons per period at full credit
  max_sale_rate: 5.0           # sale events per period at full credit
  max_stockout_rate: 3.0       # stockouts per period at no credit
  min_samples: 8               # observations needed for full score confidence

  max_batch_size: 50

  # AI explanation provider: "reasoning" (deterministic narrative, zero
  # external calls). Future: "openai" / "anthropic" plug in here.
  explanation_provider: reasoning
