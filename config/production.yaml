# ──────────────────────────────────────────────────────────────
# Amazon AI Commerce Platform — Production Configuration
# ──────────────────────────────────────────────────────────────
app:
  name: Amazon
  debug: false
  log_level: INFO
  cors:
    allowed_origins:
      - "https://amazon.example.com"
    allow_credentials: true
    allow_methods: ["GET", "POST", "PUT", "PATCH", "DELETE"]
    allow_headers: ["Authorization", "Content-Type", "X-Request-Id"]

database:
  pool_size: 20
  max_overflow: 40
  echo: false
  pool_pre_ping: true
  pool_recycle: 300

redis:
  socket_connect_timeout: 3
  # Must exceed the agent worker's BLPOP block timeout (5s); otherwise an
  # empty-queue BLPOP hits the client read timeout and logs "Timeout reading".
  socket_timeout: 20
  retry_on_timeout: false
  socket_keepalive: true
  health_check_interval: 15

server:
  host: "0.0.0.0"
  port: 8000
  reload: false
  workers: 4
  max_request_size: 5242880  # 5 MB

logging:
  format: json
  level: INFO
  handlers:
    - console
  file_path: /var/log/amazon/amazon.log
  rotation: "1 day"
  retention: "90 days"

telemetry:
  enabled: true
  service_name: amazon
  exporter_otlp_endpoint: http://otel-collector:4317
  traces_sampler: parentbased_always_on
  metrics_exporter: otlp
  logs_exporter: otlp
  instrument_fastapi: true
  instrument_sqlalchemy: true
  instrument_redis: true

features:
  enable_swagger: false
  enable_metrics: true
  rate_limiting: true

i18n:
  enabled: true
  default_language: en
  fallback_language: en
  supported_languages: [en, zh-CN]
  cookie_name: lang
  persist_to_db: true
  persist_to_user_profile: true
  cache_ttl: 3600

multilingual:
  enabled: true
  default_language: en
  supported_languages: [en, zh-CN]
  detect_min_cjk_ratio: 0.5
  detect_min_latin_ratio: 0.5
  prompt_inject_language: true
  llm_translate: true
  llm_translate_fallback: true

plugins:
  default_timeout: 30
  default_retries: 3
  suppliers:
    # Supplier plugins are auto-discovered from app/plugins/suppliers. Flip
    # `enabled: true` to let the agent scheduler scan that supplier each cycle.
    # Real suppliers need API credentials (base_url + api_key) to return
    # products. NEVER commit live keys here — keep placeholders and inject
    # credentials securely (env var / Render secret).
    # `demo` is an offline seed supplier (see app/plugins/suppliers/demo.py)
    # used to demonstrate the agent end-to-end without external APIs. Seed
    # matching products via POST /api/v1/agent/seed, then run a cycle.
    demo:
      code: demo
      name: Demo
      enabled: true
    walmart:
      code: walmart
      name: Walmart
      enabled: false
      api_key: ""
      base_url: https://marketplace.walmartapis.com/v3
    bestbuy:
      code: bestbuy
      name: Best Buy
      enabled: false
      api_key: ""
    target:
      code: target
      name: Target
      enabled: false
      api_key: ""
    costco:
      code: costco
      name: Costco
      enabled: false
      api_key: ""
    homedepot:
      code: homedepot
      name: Home Depot
      enabled: false
      api_key: ""
